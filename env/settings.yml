# eureka-hello-api env settings
# - default settings used across most projects

#==============================================
# environ
#==============================================
environ:
  LS:
    isRequired: 1
    type: boolean
    defaultValue: 0
    description: 'Hide logs (0: disabled, 1: enabled)'
    redeploy: 1
  LC:
    isRequired: 1
    type: boolean
    defaultValue: 1
    description: 'Enable log coloring (0: disabled, 1: enabled)'
    redeploy: 1
  TS:
    isRequired: 1
    type: boolean
    defaultValue: 1
    description: 'Include timestamp in logs (0: disabled, 1: enabled)'
    redeploy: 1
  NAME:
    isRequired: 1
    type: string
    defaultValue: temp
    description: 'Project profile name - e.g., lemon'
    isHidden: 1
  STAGE:
    isRequired: 1
    type: string
    options:
      - develop
      - production
    defaultValue: develop
    description: 'Deployment stage'
    isHidden: 1
    immutable: 1
  MY_DYNAMO_TABLE:
    isRequired: 0
    type: string
    description: 'Name of the DynamoDB table to use for integration'
    immutable: 1
  SQS_ENDPOINT:
    isRequired: 0
    type: string
    description: 'SQS endpoint or configuration to integrate'
    immutable: 1

#==============================================
# config
#==============================================
config:
  name:
    isRequired: 1
    type: string
    defaultValue: temp
    description: 'Name for project identification'
    isHidden: 1
  runtime:
    isRequired: 1
    type: string
    options:
      - nodejs18.x
      - nodejs22.x
      - nodejs24.x
    defaultValue: nodejs22.x
    description: 'Runtime environment'
    immutable: 1
  region:
    isRequired: 1
    type: string
    defaultValue: ap-northeast-2
    description: 'AWS region'
    immutable: 1
  env:
    isRequired: 1
    type: string
    defaultValue: temp.yml
    description: 'Name of the env file; should match the project name'
    isHidden: 1
  stage:
    isRequired: 1
    type: string
    options:
      - dev
      - prod
    defaultValue: dev
    description: 'Deployment stage'
    immutable: 1
  tableName:
    isRequired: 1
    type: string
    description: 'DynamoDB table of this service (deploy-agent creates it; name comes from the agent)'
    immutable: 1

#==============================================
# deploy - the service shape for the deploy-agent (apply@1 spec$)
# - same keys/shapes as lemon-core deploy.config.json (bootstrap); routes are ADDED to the standard 18
#   (codes-github-api data/default_settings.yml), a same method+path here wins.
#==============================================
deploy:
  routes:
    - path: /hello/{id}
      httpMethod: PUT
      authorizationType: AWS_IAM
      cors: { origin: '*', headers: [Authorization, Content-Type, X-Amz-Date, X-Amz-Security-Token, X-Amz-User-Agent, X-Api-Key, X-Lemon-Language, X-Lemon-Identity], credentials: true, allowCredentialsWithWildcardOrigin: true }
    - path: /hello/subscribe
      httpMethod: POST
      authorizationType: NONE
      cors: { origin: '*', headers: [Authorization, Content-Type, X-Amz-Date, X-Amz-Security-Token, X-Amz-User-Agent, X-Api-Key, X-Lemon-Language, X-Lemon-Identity], credentials: true, allowCredentialsWithWildcardOrigin: true }
    - path: /hello/{id}
      httpMethod: POST
      authorizationType: AWS_IAM
      cors: { origin: '*', headers: [Authorization, Content-Type, X-Amz-Date, X-Amz-Security-Token, X-Amz-User-Agent, X-Api-Key, X-Lemon-Language, X-Lemon-Identity], credentials: true, allowCredentialsWithWildcardOrigin: true }
    - path: /hello/{id}/{cmd}
      httpMethod: POST
      authorizationType: AWS_IAM
      cors: { origin: '*', headers: [Authorization, Content-Type, X-Amz-Date, X-Amz-Security-Token, X-Amz-User-Agent, X-Api-Key, X-Lemon-Language, X-Lemon-Identity], credentials: true, allowCredentialsWithWildcardOrigin: true }
    - path: /hello/{id}
      httpMethod: DELETE
      authorizationType: AWS_IAM
      cors: { origin: '*', headers: [Authorization, Content-Type, X-Amz-Date, X-Amz-Security-Token, X-Amz-User-Agent, X-Api-Key, X-Lemon-Language, X-Lemon-Identity], credentials: true, allowCredentialsWithWildcardOrigin: true }
  iam:
    - actions: [iam:GetUser, sts:GetCallerIdentity]
      resources: ['*']
